<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pragr Meena | Portfolio</title>
    <link rel="stylesheet" href="style2.css">
  </head>
  <body>
    <nav class="topnav" aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#about">About Me</a>
      <a href="#gallery">Gallery</a>
      <a href="#contact">Contact</a>
    </nav>

    <header class="welcome" id="home">
      <h1>Welcome to my website</h1>
    </header>

    <main>
      <section class="slideshow" id="gallery" aria-label="Image gallery" aria-live="off">
        <img class="mySlides" src="image 1w.jpg" alt="Portfolio image one">
        <img class="mySlides" src="image 2.jpg" alt="Portfolio image two">
        <img class="mySlides" src="image 3.jpg" alt="Portfolio image three">
      </section>

      <section class="section section-dark" id="about">
        <h2>About Me</h2>
        <p>
          Web development is the work involved in developing a website for the Internet (World Wide Web) or an intranet (a private network).
        </p>
      </section>

      <div class="pimg3">
        <div class="ptext">
          <span class="border trans">Image Three</span>
        </div>
      </div>
    </main>

    <footer class="section section-dark" id="contact">
      <p>&copy; Swati Singh. All rights reserved.</p>
    </footer>

    <script>
      // Automatic Slideshow - change image every 3 seconds
      var myIndex = 0;
      carousel();

      function carousel() {
        var i;
        var x = document.getElementsByClassName("mySlides");
        for (i = 0; i < x.length; i++) {
          x[i].style.display = "none";
        }
        myIndex++;
        if (myIndex > x.length) {
          myIndex = 1;
        }
        x[myIndex - 1].style.display = "block";
        setTimeout(carousel, 3000);
      }
    </script>
  </body>
</html>
